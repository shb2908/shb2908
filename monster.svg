<svg fill="none" viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgb(0, 255, 255); stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:rgb(0, 0, 0); stop-opacity:0" />
    </radialGradient>

    <radialGradient id="monsterBody" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#aaffff; stop-opacity:1" />
      <stop offset="90%" style="stop-color:#008888; stop-opacity:1" />
    </radialGradient>
  </defs>

  <style>
    /* Background */
    .bg { fill: #020824; }
    
    /* Monster Animation */
    .monster-container {
      transform-origin: center;
      animation: breathe 3s ease-in-out infinite alternate;
    }
    
    @keyframes breathe {
      0% { transform: scale(1); filter: drop-shadow(0 0 20px #00ffff); }
      100% { transform: scale(1.1); filter: drop-shadow(0 0 40px #00ffff); }
    }

    /* Star Animations */
    .star {
      fill: white;
      opacity: 0;
    }

    /* We create different "tracks" for stars to fly in from different angles */
    .track-1 { animation: flyIn1 4s linear infinite; }
    .track-2 { animation: flyIn2 5s linear infinite; }
    .track-3 { animation: flyIn3 3.5s linear infinite; }
    .track-4 { animation: flyIn4 4.5s linear infinite; }

    @keyframes flyIn1 {
      0% { transform: translate(0px, 0px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(400px, 300px); opacity: 0; }
    }
    @keyframes flyIn2 {
      0% { transform: translate(800px, 0px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(400px, 300px); opacity: 0; }
    }
    @keyframes flyIn3 {
      0% { transform: translate(0px, 600px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(400px, 300px); opacity: 0; }
    }
    @keyframes flyIn4 {
      0% { transform: translate(800px, 600px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(400px, 300px); opacity: 0; }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <circle cx="0" cy="0" r="3" class="star track-1" style="animation-delay: 0s; fill: #ff9;" />
  <circle cx="0" cy="0" r="4" class="star track-1" style="animation-delay: 2s; fill: #f9f;" />
  
  <circle cx="0" cy="0" r="2" class="star track-2" style="animation-delay: 1s; fill: #9ff;" />
  <circle cx="0" cy="0" r="3" class="star track-2" style="animation-delay: 3.5s; fill: #fff;" />

  <circle cx="0" cy="0" r="3" class="star track-3" style="animation-delay: 0.5s; fill: #f99;" />
  <circle cx="0" cy="0" r="4" class="star track-3" style="animation-delay: 2.5s; fill: #9f9;" />

  <circle cx="0" cy="0" r="2" class="star track-4" style="animation-delay: 1.5s; fill: #99f;" />
  <circle cx="0" cy="0" r="3" class="star track-4" style="animation-delay: 4s; fill: #fff;" />

  <g class="monster-container">
    <circle cx="400" cy="300" r="100" fill="url(#haloGrad)" />
    <circle cx="400" cy="300" r="60" fill="url(#monsterBody)" />
  </g>

</svg>